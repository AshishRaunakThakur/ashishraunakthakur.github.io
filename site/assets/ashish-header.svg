<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Ashish Raunak — Always learning, always building</title>
  <desc id="desc">A deep burgundy and charcoal banner for Ashish Raunak, BCA student at Marwadi University, Rajkot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C" />
      <stop offset=".62" stop-color="#190B12" />
      <stop offset="1" stop-color="#2A0E1B" />
    </linearGradient>
    <radialGradient id="glow" cx="83%" cy="48%" r="56%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".72" />
      <stop offset="1" stop-color="#190B12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#C77B9B" stop-opacity="0" />
      <stop offset=".5" stop-color="#C77B9B" />
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)" />
  <rect width="1200" height="360" rx="24" fill="url(#glow)" />
  <circle cx="1010" cy="176" r="112" fill="none" stroke="#C77B9B" stroke-opacity=".18" />
  <circle cx="1010" cy="176" r="78" fill="none" stroke="#C77B9B" stroke-opacity=".27" />
  <circle cx="1010" cy="176" r="44" fill="#701A3D" fill-opacity=".28" stroke="#E5B5C7" stroke-opacity=".48" />
  <path d="M1010 104v144M938 176h144M959 125l102 102M1061 125 959 227" stroke="#E5B5C7" stroke-opacity=".28" />
  <circle cx="1010" cy="176" r="7" fill="#F8F0F3" />
  <text x="76" y="78" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">STUDENT · BUILDER · LIFELONG LEARNER</text>
  <text x="72" y="166" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">Ashish Raunak</text>
  <rect x="76" y="196" width="470" height="2" fill="url(#line)" />
  <text x="76" y="240" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="22">BCA · Marwadi University, Rajkot</text>
  <text x="76" y="278" fill="#B6A3AC" font-family="Segoe UI, Arial, sans-serif" font-size="17">Learning by exploring ideas and building projects.</text>
  <text x="76" y="326" fill="#8F7380" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3">CODE · CURIOSITY · CONSISTENCY</text>
